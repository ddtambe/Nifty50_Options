name: fetch-nifty-option-chain

on:
  schedule:
    # Hardcoded every 15 min from 9:15 AM to 3:30 PM IST (Mon-Fri)
    - cron: "45 3 * * 1-5"   # 9:15 AM IST
    - cron: "0 4 * * 1-5"    # 9:30 AM IST
    - cron: "15 4 * * 1-5"   # 9:45 AM IST
    - cron: "30 4 * * 1-5"   # 10:00 AM IST
    - cron: "45 4 * * 1-5"   # 10:15 AM IST
    - cron: "0 5 * * 1-5"    # 10:30 AM IST
    - cron: "15 5 * * 1-5"   # 10:45 AM IST
    - cron: "30 5 * * 1-5"   # 11:00 AM IST
    - cron: "45 5 * * 1-5"   # 11:15 AM IST
    - cron: "0 6 * * 1-5"    # 11:30 AM IST
    - cron: "15 6 * * 1-5"   # 11:45 AM IST
    - cron: "30 6 * * 1-5"   # 12:00 PM IST
    - cron: "45 6 * * 1-5"   # 12:15 PM IST
    - cron: "0 7 * * 1-5"    # 12:30 PM IST
    - cron: "15 7 * * 1-5"   # 12:45 PM IST
    - cron: "30 7 * * 1-5"   # 1:00 PM IST
    - cron: "45 7 * * 1-5"   # 1:15 PM IST
    - cron: "0 8 * * 1-5"    # 1:30 PM IST
    - cron: "15 8 * * 1-5"   # 1:45 PM IST
    - cron: "30 8 * * 1-5"   # 2:00 PM IST
    - cron: "45 8 * * 1-5"   # 2:15 PM IST
    - cron: "0 9 * * 1-5"    # 2:30 PM IST
    - cron: "15 9 * * 1-5"   # 2:45 PM IST
    - cron: "30 9 * * 1-5"   # 3:00 PM IST
    - cron: "45 9 * * 1-5"   # 3:15 PM IST
    - cron: "0 10 * * 1-5"   # 3:30 PM IST
  workflow_dispatch:
    inputs:
      force:
        description: 'Force fetch (bypass market-hours check)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write   # allow committing data back to the repo

concurrency:
  group: fetch-nifty
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch cycle
        run: python -m nifty_oc.main
        env:
          FORCE_FETCH: ${{ github.event.inputs.force || 'false' }}
          FIVEPAISA_APP_NAME: ${{ secrets.FIVEPAISA_APP_NAME }}
          FIVEPAISA_APP_SOURCE: ${{ secrets.FIVEPAISA_APP_SOURCE }}
          FIVEPAISA_USER_ID: ${{ secrets.FIVEPAISA_USER_ID }}
          FIVEPAISA_PASSWORD: ${{ secrets.FIVEPAISA_PASSWORD }}
          FIVEPAISA_USER_KEY: ${{ secrets.FIVEPAISA_USER_KEY }}
          FIVEPAISA_ENCRYPTION_KEY: ${{ secrets.FIVEPAISA_ENCRYPTION_KEY }}
          FIVEPAISA_CLIENT_CODE: ${{ secrets.FIVEPAISA_CLIENT_CODE }}
          FIVEPAISA_TOTP_SECRET: ${{ secrets.FIVEPAISA_TOTP_SECRET }}
          FIVEPAISA_PIN: ${{ secrets.FIVEPAISA_PIN }}

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/ ]; then
            git add data/
            if git diff --staged --quiet; then
              echo "No data changes to commit."
            else
              git commit -m "data: option-chain snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
              git push
            fi
          else
            echo "No data/ folder (market off or fetch failed)."
          fi
